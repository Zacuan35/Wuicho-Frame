<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../assets/img/favicon.ico">
	<title>GF - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>

  <!-- ====
  * LOGIN *
  ===== -->
  <div class="login-container">
    <button class="btn btn-icon-only btn-circle btn-secondary" id="theme-btn" style="position:fixed;top:20px;right:20px">
      <i class="icon-solid-moon"></i>
    </button>
    <div class="login-card">
      <img src="../assets/img/logo-default.svg" alt="Logo" class="mb-4" style="height:32px">
      <h1 class="text-2xl mb-1">Iniciar sesión</h1>
      <p class="mb-4">Bienvenido de vuelta. Ingresa tus datos para continuar.</p>
      <form action="#" class="grid gap-4">
        <div class="field">
          <label for="username">Nombre de usuario</label>
          <input class="input" type="text" id="username" name="username" required placeholder="Escribe tu nombre">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" type="password" id="password" name="password" required placeholder="Escribe tu contraseña">
        </div>
        <div class="flex items-center justify-between">
          <label class="checkbox-label" style="margin:0">
            <input type="checkbox" name="remember" value="sí">
            Recordarme
          </label>
          <a href="#" class="btn-link text-sm">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      </form>
      <div class="login-divider">o</div>
      <p class="login-footer">¿No tienes una cuenta? <a href="register.html">Regístrate</a></p>
    </div>
  </div>

<!--///////
SCRIPTS
////////-->
<!-- Utilities-->
<script src="../assets/js/jquery.min.js"></script>
<!-- Components -->
<script src="../assets/js/theme_toggle.js"></script>

</body>
</html>
